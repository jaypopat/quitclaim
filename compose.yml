# Dokploy Compose Path: ./compose.yml. Route web to PORT (default 3000).
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_LOT_CONTRACT: ${LOT_CONTRACT}
    env_file: .env
    environment:
      PORT: ${PORT:-3000}
    expose: ["${PORT:-3000}"]
    restart: unless-stopped
  keeper:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_LOT_CONTRACT: ${LOT_CONTRACT}
    command: bun apps/keeper/src/keeper.ts --watch
    working_dir: /app
    env_file: .env
    volumes:
      - ${KEEPER_KEY_FILE:-../files/keeper.json}:/root/.near-credentials/testnet/${KEEPER_ACCOUNT}.json:ro
    restart: unless-stopped
