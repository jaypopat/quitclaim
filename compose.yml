services:
  web:
    build:
      context: .
      args:
        VITE_LOT_CONTRACT: ${LOT_CONTRACT}
    command: bun apps/web/.output/server/index.mjs
    env_file: .env
    expose: ["3000"]
    restart: unless-stopped
  keeper:
    build:
      context: .
      args:
        VITE_LOT_CONTRACT: ${LOT_CONTRACT}
    command: bun apps/keeper/src/keeper.ts --watch
    env_file: .env
    volumes:
      - ../files/keeper.json:/root/.near-credentials/testnet/${KEEPER_ACCOUNT}.json:ro
    restart: unless-stopped
