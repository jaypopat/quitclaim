[package]
name = "quitclaim-lot"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/jaypopat/quitclaim"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.20.3-rust-1.93.0"
image_digest = "sha256:8e61653261766ff251a6c6c2004f2745446fc1ba74d807b3daf6e2cc5cf99ea9"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = { version = "5.30", features = ["unstable"] }
omni-transaction = { version = "0.5.0", default-features = false, features = ["evm", "serde", "serde_json"] }
hex = "0.4"
bs58 = "0.5"
schemars = "0.8"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unstable", "unit-testing"] }
