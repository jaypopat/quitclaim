[package]
name = "quitclaim-lot"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/jaypopat/quitclaim"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
# Pinned to the revision `v1.signer-prod.testnet` runs, so payload hashes match what MPC attests.
near-mpc-contract-interface = { git = "https://github.com/near/mpc", rev = "e691bdb98d68dcf74653da58d043453a6318765f", features = ["call-args"] }
near-mpc-sdk = { git = "https://github.com/near/mpc", rev = "e691bdb98d68dcf74653da58d043453a6318765f" }
# 1.7 pins proc-macro-error3 <=3.0.1, which near-sdk 5.30 can't satisfy.
alloy-sol-types = { version = "=1.6.0", default-features = false }
alloy-primitives = { version = "1", default-features = false, features = ["borsh"] }
serde_json = "1"
near-sdk = { version = "5.30", features = ["unstable"] }
omni-transaction = { version = "0.5.0", default-features = false, features = ["evm", "serde", "serde_json"] }
hex = "0.4"
schemars = "0.8"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
near-contract-standards = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unstable", "unit-testing"] }
secp256k1 = { version = "0.27", default-features = false, features = ["recovery", "alloc"] }
